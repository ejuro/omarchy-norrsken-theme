# Norrsken: Omarchy shell surfaces as frosted, translucent glass.
# Full replacement for the generated shell.toml (same keys as default/themed/shell.toml.tpl).

[bar]
background       = "#050c0b"
background-alpha = 0.55
text             = "#cdf2e3"
active           = "#ff6f91"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
active-border            = "rgba(5dffb0ee) rgba(9d8cffcc) 45deg"
active-border-foreground = "rgba(cdf2e3ee) rgba(9d8cffcc) 45deg"

[controls]
normal-color        = "#cdf2e3"
normal-fill-alpha   = 0.03
normal-border       = "#cdf2e3"
normal-border-width = 1
normal-border-alpha = 0.18

hover-cursor-color        = "#5dffb0"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#5dffb0"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.35

focus-color        = "#5dffb0"
focus-fill-alpha   = 0.08
focus-border       = "#5dffb0"
focus-border-width = 1
focus-border-alpha = 0.35

# the active workspace / current item: a glowing accent pill
selected-color        = "#5dffb0"
selected-fill-alpha   = 0.16
selected-border       = "#5dffb0"
selected-border-width = 1
selected-border-alpha = 0.6

pressed-fill-alpha   = 0.24
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#050c0b"
background-alpha = 0.85
text             = "#cdf2e3"
border           = "hyprland.active-border"
border-alpha     = 0.8

[tooltip]
background       = "#050c0b"
background-alpha = 0.9
text             = "#cdf2e3"
border           = "hyprland.active-border-foreground"
border-alpha     = 0.6

[notifications]
background       = "#050c0b"
background-alpha = 0.82
text             = "#cdf2e3"
border           = "hyprland.active-border"
border-alpha     = 0.9
countdown        = "#5dffb0"

[launcher]
background                = "#050c0b"
background-alpha          = 0.72
text                      = "#cdf2e3"
border                    = "hyprland.active-border"
border-alpha              = 0.9
scrim                     = "#020605"
scrim-alpha               = 0.45
selected-background       = "#5dffb0"
selected-background-alpha = 0.12
selected-text             = "#5dffb0"
selected-border           = "#5dffb0"
selected-border-alpha     = 0.5

[menu]
background                = "#050c0b"
background-alpha          = 0.85
text                      = "#cdf2e3"
border                    = "hyprland.active-border"
border-alpha              = 0.9
scrim                     = "#020605"
scrim-alpha               = 0.45
selected-background       = "#5dffb0"
selected-background-alpha = 0.12
selected-text             = "#5dffb0"
selected-border           = "#5dffb0"
selected-border-alpha     = 0.5

[polkit]
background       = "#050c0b"
background-alpha = 0.9
text             = "#cdf2e3"
text-error       = "#ff6f91"
border           = "hyprland.active-border"
border-error     = "#ff6f91"
border-alpha     = 1.0
scrim            = "#020605"
scrim-alpha      = 0.55
accent           = "#5dffb0"

[lock]
background       = "#050c0b"
background-alpha = 0.55
text             = "#cdf2e3"
placeholder      = "#5e7c72"
text-error       = "#ff6f91"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#ff6f91"
border-alpha     = 1.0
selection        = "#5dffb0"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#020605"
scrim-alpha             = 0.55
text                    = "#cdf2e3"
selected-border         = "#5dffb0"
selected-border-alpha   = 1.0
unselected-border       = "#cdf2e3"
unselected-border-alpha = 0.22
